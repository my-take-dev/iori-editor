<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>IORI - Login</title>
    <script src="/vendor/htmx.min.js"></script>
    <style>
        :root {
            --bg-primary: #0d1117;
            --bg-secondary: #161b22;
            --bg-tertiary: #21262d;
            --border-color: #30363d;
            --text-primary: #f0f6fc;
            --text-secondary: #8b949e;
            --accent-blue: #58a6ff;
            --accent-red: #f85149;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .login-box {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 32px;
            width: 90%;
            max-width: 340px;
        }
        .logo {
            font-size: 48px;
            text-align: center;
            margin-bottom: 8px;
        }
        h1 {
            font-size: 24px;
            margin-bottom: 8px;
            text-align: center;
        }
        .subtitle {
            color: var(--text-secondary);
            text-align: center;
            margin-bottom: 24px;
            font-size: 14px;
        }
        .form-group { margin-bottom: 16px; }
        label {
            display: block;
            font-size: 14px;
            margin-bottom: 8px;
            color: var(--text-secondary);
        }
        input[type="password"] {
            width: 100%;
            padding: 12px 16px;
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 16px;
        }
        input[type="password"]:focus {
            outline: none;
            border-color: var(--accent-blue);
        }
        button {
            width: 100%;
            padding: 14px;
            background: var(--accent-blue);
            border: none;
            border-radius: 8px;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }
        button:active { opacity: 0.8; }
        button:disabled {
            background: var(--bg-tertiary);
            cursor: not-allowed;
        }
        .error {
            color: var(--accent-red);
            font-size: 14px;
            margin-bottom: 16px;
            text-align: center;
            padding: 8px;
            background: rgba(248, 81, 73, 0.1);
            border-radius: 6px;
        }
        .htmx-request button {
            opacity: 0.7;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <div class="logo">&#x1F510;</div>
        <h1>IORI</h1>
        <p class="subtitle">Server Mode</p>

        <div id="error-message"></div>

        <form hx-post="/api/auth/login"
              hx-target="#error-message"
              hx-swap="innerHTML">
            <div class="form-group">
                <label for="password">&#x1F511; Password</label>
                <input type="password"
                       id="password"
                       name="password"
                       placeholder="Enter password"
                       autofocus
                       required>
            </div>
            <button type="submit">Login</button>
        </form>
    </div>
</body>
</html>
